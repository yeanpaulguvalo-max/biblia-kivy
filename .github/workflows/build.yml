name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java y dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Buildozer y python-for-android (versiones fijas y probadas)
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 "python-for-android==2024.1.21"

      - name: Compilar APK
        run: |
          yes | buildozer android debug

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: palabra-del-dia-apk
          path: bin/*.apk
