name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar APK con Buildozer (imagen oficial)
        run: |
          docker run --rm -v "$(pwd)":/home/user/hostcwd ghcr.io/kivy/buildozer:latest buildozer android debug

      - name: Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: palabra-del-dia-apk
          path: bin/*.apk
